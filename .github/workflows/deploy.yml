name: Full Stack Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: full-stack-production
      cancel-in-progress: false
    steps:
      - name: Deploy FrontEnd, Crawl, and OpenMAIC
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -euo pipefail

            FRONTEND_DIR="${FRONTEND_DIR:-$HOME/FrontEnd}"
            BACKEND_DIR="${BACKEND_DIR:-$HOME/Backend}"
            BACKEND_RUNTIME_BACKUP="/tmp/backend-crawl-runtime-backup"

            for dir in "$FRONTEND_DIR" "$BACKEND_DIR"; do
              if [ ! -d "$dir/.git" ]; then
                echo "Missing git repo: $dir" >&2
                exit 1
              fi
            done

            backup_backend_runtime() {
              rm -rf "$BACKEND_RUNTIME_BACKUP"
              mkdir -p "$BACKEND_RUNTIME_BACKUP"

              if [ -f "$BACKEND_DIR/Crawl/db/ai_news.db" ]; then
                cp -f "$BACKEND_DIR/Crawl/db/ai_news.db" "$BACKEND_RUNTIME_BACKUP/ai_news.db"
              fi

              if [ -d "$BACKEND_DIR/Crawl/logs" ]; then
                cp -a "$BACKEND_DIR/Crawl/logs" "$BACKEND_RUNTIME_BACKUP/logs"
              fi
            }

            restore_backend_runtime() {
              mkdir -p "$BACKEND_DIR/Crawl/db" "$BACKEND_DIR/Crawl/logs"

              if [ -f "$BACKEND_RUNTIME_BACKUP/ai_news.db" ]; then
                cp -f "$BACKEND_RUNTIME_BACKUP/ai_news.db" "$BACKEND_DIR/Crawl/db/ai_news.db"
              fi

              if [ -d "$BACKEND_RUNTIME_BACKUP/logs" ]; then
                rm -rf "$BACKEND_DIR/Crawl/logs"
                cp -a "$BACKEND_RUNTIME_BACKUP/logs" "$BACKEND_DIR/Crawl/logs"
              fi
            }

            sync_repo() {
              local repo_dir="$1"
              local branch="${2:-main}"
              local mode="${3:-plain}"

              cd "$repo_dir"

              if [ "$mode" = "backend" ]; then
                backup_backend_runtime
              fi

              git fetch origin "$branch"
              git checkout "$branch"
              git reset --hard "origin/$branch"
              if [ "$mode" = "backend" ]; then
                git clean -fd \
                  -e Crawl/db \
                  -e Crawl/logs \
                  -e WorkShop/.env \
                  -e WorkShop/metrics.db \
                  -e WorkShop/metrics.db-shm \
                  -e WorkShop/metrics.db-wal \
                  -e OpenMAIC/.env.local \
                  -e Agent-Do/data
              else
                git clean -fd \
                  -e .env \
                  -e .env.local \
                  -e .env.production.local
              fi

              if [ "$mode" = "backend" ]; then
                restore_backend_runtime
              fi

              echo "Synced $(basename "$repo_dir") -> $(git rev-parse --short HEAD)"
            }

            sync_repo "$BACKEND_DIR" main backend
            sync_repo "$FRONTEND_DIR" main plain

            docker compose -f "$BACKEND_DIR/Crawl/docker-compose.yml" up -d --build --remove-orphans
            export AGENT_DATA_HOST_ROOT="${AGENT_DATA_HOST_ROOT:-$BACKEND_DIR/Agent-Do/data}"
            docker compose -f "$BACKEND_DIR/WorkShop/docker-compose.yml" up -d --build --remove-orphans
            docker compose -f "$BACKEND_DIR/OpenMAIC/docker-compose.yml" up -d --build --remove-orphans
            docker compose -f "$FRONTEND_DIR/docker-compose.yml" up -d --build --remove-orphans

            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep -E "frontend|Crawl|openmaic|Workshop|agent-do|NAME"
            echo "Full stack deployed at $(date -Is)"
