name: Frontend Deploy

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_PORT: "22"
      SSH_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
      FRONTEND_DEPLOY_PATH: /data/projects/Web_Frontend
      BACKEND_DEPLOY_PATH: /data/projects/Backend/deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            "$SSH_USER@$SSH_HOST" "echo 'SSH authentication check passed.'"

      - name: Upload frontend source
        timeout-minutes: 8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "FRONTEND_DEPLOY_PATH='${FRONTEND_DEPLOY_PATH}' GH_REPOSITORY='${GITHUB_REPOSITORY}' GH_SHA='${GITHUB_SHA}' GH_TOKEN='${GH_TOKEN}' sh -s" <<'REMOTE'
          set -eu

          FRONTEND_DEPLOY_PATH="${FRONTEND_DEPLOY_PATH:-/data/projects/Web_Frontend}"
          GH_REPOSITORY="${GH_REPOSITORY:?missing repository}"
          GH_SHA="${GH_SHA:?missing sha}"
          GH_TOKEN="${GH_TOKEN:?missing GitHub token}"

          case "$FRONTEND_DEPLOY_PATH" in
            /data/projects/Web_Frontend|/data/projects/Web_Frontend/*) ;;
            *) echo "Refusing to replace unexpected frontend path: $FRONTEND_DEPLOY_PATH" >&2; exit 1 ;;
          esac

          remote_archive="/tmp/frontend-source-${GH_SHA}.tar.gz"
          curl -fsSL \
            --connect-timeout 15 \
            --max-time 300 \
            --retry 5 \
            --retry-delay 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GH_REPOSITORY}/tarball/${GH_SHA}" \
            -o "$remote_archive"

          mkdir -p "$FRONTEND_DEPLOY_PATH"
          rm -rf \
            "$FRONTEND_DEPLOY_PATH/.github" \
            "$FRONTEND_DEPLOY_PATH/docs" \
            "$FRONTEND_DEPLOY_PATH/public" \
            "$FRONTEND_DEPLOY_PATH/scripts" \
            "$FRONTEND_DEPLOY_PATH/src"
          rm -f \
            "$FRONTEND_DEPLOY_PATH/.dockerignore" \
            "$FRONTEND_DEPLOY_PATH/.env.example" \
            "$FRONTEND_DEPLOY_PATH/.gitattributes" \
            "$FRONTEND_DEPLOY_PATH/.gitignore" \
            "$FRONTEND_DEPLOY_PATH/Dockerfile" \
            "$FRONTEND_DEPLOY_PATH/index.html" \
            "$FRONTEND_DEPLOY_PATH/nginx.conf" \
            "$FRONTEND_DEPLOY_PATH/package.json" \
            "$FRONTEND_DEPLOY_PATH/pnpm-lock.yaml" \
            "$FRONTEND_DEPLOY_PATH/README.md" \
            "$FRONTEND_DEPLOY_PATH/vite.config.js"
          tar -xzf "$remote_archive" --strip-components=1 -C "$FRONTEND_DEPLOY_PATH"
          rm -f "$remote_archive"
          REMOTE

      - name: Deploy frontend
        timeout-minutes: 30
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "FRONTEND_DEPLOY_PATH='${FRONTEND_DEPLOY_PATH}' BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' FRONTEND_VITE_OPENMAIC_BASE_URL_OVERRIDE='/openmaic' FRONTEND_VITE_OPENMAIC_APP_URL_OVERRIDE='/openmaic' bash -s" <<'REMOTE'
          set -euo pipefail

          FRONTEND_DEPLOY_PATH="${FRONTEND_DEPLOY_PATH:-/data/projects/Web_Frontend}"
          BACKEND_DEPLOY_PATH="${BACKEND_DEPLOY_PATH:-/data/projects/Backend/deploy}"
          cd "$BACKEND_DEPLOY_PATH"
          if [ -f ./.env ]; then
            set -a
            source ./.env
            set +a
          fi
          chmod +x ./up.sh
          WEB_FRONTEND_CONTEXT="$FRONTEND_DEPLOY_PATH" ./up.sh --force-recreate web-frontend
          docker compose ps web-frontend

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${WEB_FRONTEND_PORT:-80}/" >/dev/null; then
              echo "Frontend health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Frontend health check failed." >&2
          docker compose logs --tail 80 web-frontend >&2 || true
          exit 1
          REMOTE
