name: Frontend Deploy

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER }}
      SSH_PORT: "22"
      SSH_KEY: ${{ secrets.SERVER_PRIVATE_KEY }}
      FRONTEND_DEPLOY_PATH: /data/projects/Web_Frontend
      BACKEND_DEPLOY_PATH: /data/projects/Backend/deploy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend source
        run: |
          set -euo pipefail

          archive="frontend-source-${GITHUB_RUN_ID}.tar.gz"
          remote_archive="/tmp/${archive}"

          git archive --format=tar.gz -o "$archive" HEAD
          scp -i ~/.ssh/deploy_key -P "${SSH_PORT:-22}" \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=4 \
            "$archive" "$SSH_USER@$SSH_HOST:$remote_archive"

          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "FRONTEND_DEPLOY_PATH='${FRONTEND_DEPLOY_PATH}' REMOTE_ARCHIVE='${remote_archive}' sh -s" <<'REMOTE'
          set -eu

          FRONTEND_DEPLOY_PATH="${FRONTEND_DEPLOY_PATH:-/data/projects/Web_Frontend}"
          REMOTE_ARCHIVE="${REMOTE_ARCHIVE:?missing archive path}"

          case "$FRONTEND_DEPLOY_PATH" in
            /data/projects/Web_Frontend|/data/projects/Web_Frontend/*) ;;
            *) echo "Refusing to replace unexpected frontend path: $FRONTEND_DEPLOY_PATH" >&2; exit 1 ;;
          esac

          tmp_dir="${FRONTEND_DEPLOY_PATH}.incoming"
          rm -rf "$tmp_dir"
          mkdir -p "$tmp_dir"
          tar -xzf "$REMOTE_ARCHIVE" -C "$tmp_dir"
          rm -rf "$FRONTEND_DEPLOY_PATH"
          mv "$tmp_dir" "$FRONTEND_DEPLOY_PATH"
          rm -f "$REMOTE_ARCHIVE"
          REMOTE

      - name: Deploy frontend
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "FRONTEND_DEPLOY_PATH='${FRONTEND_DEPLOY_PATH}' BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' FRONTEND_VITE_OPENMAIC_BASE_URL_OVERRIDE='/openmaic' FRONTEND_VITE_OPENMAIC_APP_URL_OVERRIDE='/openmaic' bash -s" <<'REMOTE'
          set -euo pipefail

          FRONTEND_DEPLOY_PATH="${FRONTEND_DEPLOY_PATH:-/data/projects/Web_Frontend}"
          BACKEND_DEPLOY_PATH="${BACKEND_DEPLOY_PATH:-/data/projects/Backend/deploy}"
          cd "$BACKEND_DEPLOY_PATH"
          if [ -f ./.env ]; then
            set -a
            source ./.env
            set +a
          fi
          chmod +x ./up.sh
          WEB_FRONTEND_CONTEXT="$FRONTEND_DEPLOY_PATH" ./up.sh --force-recreate web-frontend
          docker compose ps web-frontend

          for attempt in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:${WEB_FRONTEND_PORT:-80}/" >/dev/null; then
              echo "Frontend health check passed."
              exit 0
            fi
            sleep 2
          done

          echo "Frontend health check failed." >&2
          docker compose logs --tail 80 web-frontend >&2 || true
          exit 1
          REMOTE
