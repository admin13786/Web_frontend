name: FrontEnd Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency:
      group: frontend-production
      cancel-in-progress: false
    steps:
      - name: Deploy FrontEnd
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -euo pipefail

            FRONTEND_DIR="${FRONTEND_DIR:-$HOME/FrontEnd-0317}"

            if [ ! -d "$FRONTEND_DIR/.git" ]; then
              echo "Missing git repo: $FRONTEND_DIR" >&2
              exit 1
            fi

            cd "$FRONTEND_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd \
              -e .env \
              -e .env.local \
              -e .env.production.local

            docker compose -f "$FRONTEND_DIR/docker-compose.yml" up -d --build --remove-orphans

            docker ps --format "table {{.Names}}\t{{.Image}}\t{{.Status}}" | grep -E "frontend|NAME"
            echo "Frontend deployed at $(date -Is)"
