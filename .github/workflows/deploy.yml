name: Frontend Deploy

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST || secrets.ECS_HOST || secrets.ALIYUN_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER || secrets.ECS_USER || secrets.ALIYUN_USER }}
      SSH_PORT: ${{ secrets.SERVER_PORT || secrets.ECS_PORT || secrets.ALIYUN_PORT }}
      SSH_KEY: ${{ secrets.SERVER_PRIVATE_KEY || secrets.ECS_SSH_KEY || secrets.ALIYUN_SSH_KEY }}
      FRONTEND_DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
      BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}

    steps:
      - name: Validate secrets
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Deploy frontend
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "FRONTEND_DEPLOY_PATH='${FRONTEND_DEPLOY_PATH}' BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail

          FRONTEND_DEPLOY_PATH="${FRONTEND_DEPLOY_PATH:-}"
          if [ -z "$FRONTEND_DEPLOY_PATH" ]; then
            for candidate in /data/projects/Web_Frontend /data/projects/Web_frontend "$HOME/Web_Frontend" "$HOME/Web_frontend"; do
              if [ -d "$candidate/.git" ]; then
                FRONTEND_DEPLOY_PATH="$candidate"
                break
              fi
            done
          fi
          if [ -z "$FRONTEND_DEPLOY_PATH" ]; then
            echo "Frontend deploy path not found. Set FRONTEND_DEPLOY_PATH secret or clone Web_Frontend to /data/projects/Web_Frontend."
            exit 1
          fi

          BACKEND_DEPLOY_PATH="${BACKEND_DEPLOY_PATH:-}"
          if [ -z "$BACKEND_DEPLOY_PATH" ]; then
            for candidate in /data/projects/Backend/deploy "$HOME/Backend/deploy"; do
              if [ -d "$candidate" ]; then
                BACKEND_DEPLOY_PATH="$candidate"
                break
              fi
            done
          fi
          if [ -z "$BACKEND_DEPLOY_PATH" ]; then
            echo "Backend deploy path not found. Set BACKEND_DEPLOY_PATH secret or clone Backend to /data/projects/Backend."
            exit 1
          fi

          cd "$FRONTEND_DEPLOY_PATH"
          git fetch origin main
          git pull --ff-only origin main

          cd "$BACKEND_DEPLOY_PATH"
          WEB_FRONTEND_CONTEXT="$FRONTEND_DEPLOY_PATH" docker compose up -d --build --force-recreate web-frontend
          docker compose ps web-frontend
          REMOTE
