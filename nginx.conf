map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;
    resolver 127.0.0.11 valid=30s ipv6=off;

    set $crawl_api http://aiedu-crawl-api:8000;
    set $workshop_api http://aiedu-workshop:5000;
    set $edurepo_api http://aiedu-edurepo-backend:9010;
    set $openmaic_api http://aiedu-openmaic:3000;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    location = /api/workshop-history {
        proxy_pass $crawl_api;
    }

    location ^~ /api/workshop-history/ {
        proxy_pass $crawl_api;
    }

    location = /api/workshop {
        rewrite ^ / break;
        proxy_pass $workshop_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_set_header Connection "";
    }

    location ^~ /api/workshop/ {
        rewrite ^/api/workshop/?(.*)$ /$1 break;
        proxy_pass $workshop_api;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        send_timeout 3600s;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_set_header Connection "";
    }

    location = /api/edu {
        proxy_pass $edurepo_api;
    }

    location ^~ /api/edu/ {
        proxy_pass $edurepo_api;
    }

    location = /openmaic {
        rewrite ^ / break;
        proxy_pass $openmaic_api;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /openmaic/ {
        rewrite ^/openmaic/?(.*)$ /$1 break;
        proxy_pass $openmaic_api;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    location ^~ /api/ {
        proxy_pass $crawl_api;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
