# 前端静态站点。API / Workshop 上游通过环境变量配置，默认走宿主机端口。
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:alpine}
        NGINX_CONF: ${NGINX_CONF:-nginx.conf}
        VITE_API_BASE: ${VITE_API_BASE:-}
        VITE_USE_MOCK: ${VITE_USE_MOCK:-true}
        VITE_RANK_VIDEO_MOCK: ${VITE_RANK_VIDEO_MOCK:-true}
        VITE_RANK_WEIBO_MOCK: ${VITE_RANK_WEIBO_MOCK:-false}
        NPM_REGISTRY: ${FRONTEND_NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_ALT_PORT:-8081}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=production
      - NGINX_API_UPSTREAM_HOST=${NGINX_API_UPSTREAM_HOST:-host.docker.internal}
      - NGINX_API_UPSTREAM_PORT=${NGINX_API_UPSTREAM_PORT:-8000}
      - NGINX_WORKSHOP_UPSTREAM_HOST=${NGINX_WORKSHOP_UPSTREAM_HOST:-host.docker.internal}
      - NGINX_WORKSHOP_UPSTREAM_PORT=${NGINX_WORKSHOP_UPSTREAM_PORT:-5000}
      - NGINX_EDUREPO_APP_UPSTREAM_HOST=${NGINX_EDUREPO_APP_UPSTREAM_HOST:-host.docker.internal}
      - NGINX_EDUREPO_APP_UPSTREAM_PORT=${NGINX_EDUREPO_APP_UPSTREAM_PORT:-5188}
      - NGINX_EDUREPO_API_UPSTREAM_HOST=${NGINX_EDUREPO_API_UPSTREAM_HOST:-host.docker.internal}
      - NGINX_EDUREPO_API_UPSTREAM_PORT=${NGINX_EDUREPO_API_UPSTREAM_PORT:-9010}
    restart: unless-stopped
