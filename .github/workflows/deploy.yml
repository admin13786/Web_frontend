name: Frontend Deploy

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: frontend-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    env:
      SSH_HOST: ${{ secrets.SERVER_HOST || secrets.ECS_HOST || secrets.ALIYUN_HOST }}
      SSH_USER: ${{ secrets.SERVER_USER || secrets.ECS_USER || secrets.ALIYUN_USER }}
      SSH_PORT: ${{ secrets.SERVER_PORT || secrets.ECS_PORT || secrets.ALIYUN_PORT }}
      SSH_KEY: ${{ secrets.SERVER_PRIVATE_KEY || secrets.ECS_SSH_KEY || secrets.ALIYUN_SSH_KEY }}
      FRONTEND_DEPLOY_PATH: ${{ secrets.FRONTEND_DEPLOY_PATH }}
      BACKEND_DEPLOY_PATH: ${{ secrets.BACKEND_DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          test -n "$SSH_HOST"
          test -n "$SSH_USER"
          test -n "$SSH_KEY"

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${SSH_PORT:-22}" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload frontend source
        run: |
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='*.env' \
            --exclude='dist' \
            --exclude='build' \
            --exclude='node_modules' \
            --exclude='.pnpm-store' \
            --exclude='coverage' \
            -czf - . | ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
              "FRONTEND_DEPLOY_PATH='${FRONTEND_DEPLOY_PATH}' sh -c 'set -eu; FRONTEND_DEPLOY_PATH=\"\${FRONTEND_DEPLOY_PATH:-/data/projects/Web_Frontend}\"; mkdir -p \"\$FRONTEND_DEPLOY_PATH\"; tar -xzf - -C \"\$FRONTEND_DEPLOY_PATH\"'"

      - name: Deploy frontend
        run: |
          ssh -i ~/.ssh/deploy_key -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" \
            "FRONTEND_DEPLOY_PATH='${FRONTEND_DEPLOY_PATH}' BACKEND_DEPLOY_PATH='${BACKEND_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -euo pipefail

          FRONTEND_DEPLOY_PATH="${FRONTEND_DEPLOY_PATH:-/data/projects/Web_Frontend}"
          BACKEND_DEPLOY_PATH="${BACKEND_DEPLOY_PATH:-/data/projects/Backend/deploy}"
          cd "$BACKEND_DEPLOY_PATH"
          if [ -f ./.env ]; then
            set -a
            source ./.env
            set +a
          fi
          WEB_FRONTEND_CONTEXT="$FRONTEND_DEPLOY_PATH" docker compose up -d --build --force-recreate web-frontend
          docker compose ps web-frontend
          REMOTE
